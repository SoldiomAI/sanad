name: 🎙️ نشرة المذيع اليومية
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sanad-daily
  cancel-in-progress: false
jobs:
  bulletin:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: sudo apt-get install -y -q ffmpeg
      - run: pip install -q edge-tts gradio_client
      - run: npm i -g --no-audit --no-fund --prefer-offline @google/gemini-cli@latest   # أخفُّ تثبيتًا: بلا تدقيقٍ ولا تمويلٍ ومع تفضيلِ الكاش
      - name: النشرة الكاملة (نص → صوت → فيديو) بكل الوكلاء
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        run: python pipeline/daily_anchor.py
      - name: حفظ في الريبو
        id: save
        if: always()
        run: |
          git config user.name "SANAD Bot"
          git config user.email "soldiom@gmail.com"
          git add daily/
          git diff --cached --quiet && exit 0
          git commit -m "🎙️ نشرة $(date +%F) [skip ci] [vercel skip]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main; then git push && exit 0
            else git rebase --abort 2>/dev/null || true; fi   # لا تُبقِ علامات تعارض في شجرة العمل
            echo "محاولة $i…"; sleep $((i*6))
          done
          exit 1
      - name: نشر البيانات للمستودع العام
        if: always() && steps.save.outcome == 'success'
        env:
          DATA_DEPLOY_KEY: ${{ secrets.DATA_DEPLOY_KEY }}
        run: |
          [ -z "$DATA_DEPLOY_KEY" ] && exit 0
          # حارس: لا تُنشر ملفّات فيها علامات تعارض Git إلى المستودع العام
          if grep -rlqE '^(<<<<<<<|=======|>>>>>>>)' daily/; then
            echo "❌ daily/ يحوي علامات تعارض — أُلغي النشر حمايةً للموقع الحيّ"; exit 1; fi
          python3 .github/scripts/guard-social-publish.py
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DATA_DEPLOY_KEY" > ~/.ssh/sanad_deploy; chmod 600 ~/.ssh/sanad_deploy
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/sanad_deploy -o IdentitiesOnly=yes"
          rm -rf /tmp/pub && git clone -q --depth 1 \
            git@github.com:SoldiomAI/sanad-data.git /tmp/pub
          mkdir -p /tmp/pub/daily
          cp -r daily/* /tmp/pub/daily/ 2>/dev/null || true
          bash .github/scripts/publish-hygiene.sh /tmp/pub/daily
          cd /tmp/pub
          git config user.name "SANAD Bot"; git config user.email "soldiom@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "📦 بيانات $(date -u +%F\ %H:%M)"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin main; then
              if grep -rlqE '^(<<<<<<<|=======|>>>>>>>)' daily/; then git rebase --abort 2>/dev/null || true
              else git push -q && exit 0; fi
            else git rebase --abort 2>/dev/null || true; fi
            sleep $((i*4))
          done
          exit 1
