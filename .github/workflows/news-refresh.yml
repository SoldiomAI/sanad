name: news-refresh
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force_official:
        description: "1 = تجاوز المهلة وأجبِر جلبَ البيانات الرسمية (المَنبع) الآن"
        required: false
        default: ""
      force_rumors:
        description: "1 = أجبِر تشغيلَ رصد الشائعات الآن (تجاوز مهلة الـ٦س)"
        required: false
        default: ""
      force_alerts:
        description: "1 = أجبِر جمعَ التحذيرات الرسمية (المُنبِّه) الآن"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: sanad-daily
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm i -g --no-audit --no-fund --prefer-offline @google/gemini-cli@latest   # أخفُّ تثبيتًا: بلا تدقيقٍ ولا تمويلٍ ومع تفضيلِ الكاش
      - run: pip install -q edge-tts pillow arabic-reshaper python-bidi || true   # صوتُ المحلّل + بطاقة السوشيال — غيرُ حاسمٍ فلا يُعطِّلُ الأخبار
      - name: تحديث الأخبار وتشغيل الوكلاء
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          NEWS_ONLY: "1"
          FORCE_OFFICIAL: ${{ github.event.inputs.force_official }}
          FORCE_RUMORS: ${{ github.event.inputs.force_rumors }}
          FORCE_ALERTS: ${{ github.event.inputs.force_alerts }}
          # الشاهدُ الميدانيّ (OSINT) — مصادرُ مِفتاحيّةٌ اختياريّةٌ مجّانيّةُ التسجيل؛
          # إن لم تُضبَط بقيتْ فارغةً فتخطّى الشاهدُ مصدرَها صامتًا (USGS/OpenSky يعملان بلا مفتاح).
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
          # بوّابةُ المؤسسات — تغذيةُ تاريخِ المؤشّر (اختياريّةٌ، تخطٍّ صامتٌ بلا الأسرار)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pipeline/daily_anchor.py
      - name: حفظ
        id: save
        if: always()
        run: |
          git config user.name "sanad-bot"
          git config user.email "bot@sanad.news"
          git add daily/
          git diff --cached --quiet && exit 0
          git commit -m "🗞️ تحديث $(date -u +%H:%M) [vercel skip]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main; then git push && exit 0
            else git rebase --abort 2>/dev/null || true; fi   # لا تُبقِ علامات تعارض في شجرة العمل
            echo "محاولة $i…"; sleep $((i*6))
          done
          exit 1
      - name: نشر البيانات للمستودع العام
        # لا تنشر إن فشل الحفظ — كان يدفع workspace قديم/متعارض إلى sanad-data
        if: always() && steps.save.outcome == 'success'
        env:
          DATA_PUSH_TOKEN: ${{ secrets.DATA_PUSH_TOKEN }}
        run: |
          [ -z "$DATA_PUSH_TOKEN" ] && exit 0
          # حارس: لا تُنشر ملفّات فيها علامات تعارض Git إلى المستودع العام
          if grep -rlqE '^(<<<<<<<|=======|>>>>>>>)' daily/; then
            echo "❌ daily/ يحوي علامات تعارض — أُلغي النشر حمايةً للموقع الحيّ"; exit 1; fi
          python3 .github/scripts/guard-social-publish.py
          rm -rf /tmp/pub && git clone -q --depth 1 \
            "https://x-access-token:${DATA_PUSH_TOKEN}@github.com/Soldiom/sanad-data.git" /tmp/pub
          mkdir -p /tmp/pub/daily
          cp -r daily/* /tmp/pub/daily/ 2>/dev/null || true
          cd /tmp/pub
          git config user.name "SANAD Bot"; git config user.email "soldiom@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "📦 بيانات $(date -u +%F\ %H:%M)"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin main; then
              if grep -rlqE '^(<<<<<<<|=======|>>>>>>>)' daily/; then git rebase --abort 2>/dev/null || true
              else git push -q && exit 0; fi
            else git rebase --abort 2>/dev/null || true; fi
            sleep $((i*4))
          done
          exit 1
