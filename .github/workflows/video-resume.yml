name: 🎬 استئناف الفيديو
on:
  schedule:
    - cron: '25 */3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sanad-daily
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get install -y -q ffmpeg
      - run: pip install -q edge-tts gradio_client
      - name: استئناف مقاطع الفيديو الناقصة
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          VIDEO_ONLY: "1"
          SKIP_COUNCIL: "1"
        run: python pipeline/daily_anchor.py
      - name: حفظ
        id: save
        if: always()
        run: |
          git config user.name "sanad-bot"
          git config user.email "bot@sanad.news"
          git add daily/
          git diff --cached --quiet && exit 0
          git commit -m "🎬 استئناف الفيديو $(date -u +%H:%M) [skip ci] [vercel skip]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main; then git push && exit 0
            else git rebase --abort 2>/dev/null || true; fi   # لا تُبقِ علامات تعارض في شجرة العمل
            sleep $((i*6))
          done
          exit 1
      - name: نشر البيانات للمستودع العام
        if: always() && steps.save.outcome == 'success'
        env:
          DATA_DEPLOY_KEY: ${{ secrets.DATA_DEPLOY_KEY }}
        run: |
          [ -z "$DATA_DEPLOY_KEY" ] && exit 0
          if grep -rlqE '^(<<<<<<<|=======|>>>>>>>)' daily/; then
            echo "❌ daily/ يحوي علامات تعارض — أُلغي النشر حمايةً للموقع الحيّ"; exit 1; fi
          # VIDEO_ONLY قد لا يُعيد بناء المنشورات — لا تدهس sanad-data إن كانت سيئة
          set +e
          python3 .github/scripts/guard-social-publish.py --soft
          GUARD=$?
          set -e
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DATA_DEPLOY_KEY" > ~/.ssh/sanad_deploy; chmod 600 ~/.ssh/sanad_deploy
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/sanad_deploy -o IdentitiesOnly=yes"
          rm -rf /tmp/pub && git clone -q --depth 1 \
            git@github.com:SoldiomAI/sanad-data.git /tmp/pub
          mkdir -p /tmp/pub/daily
          cp -r daily/* /tmp/pub/daily/ 2>/dev/null || true
          if [ "$GUARD" = "2" ]; then
            echo "⚠️ keeping remote posts/comments/bundle"
            cd /tmp/pub && git checkout HEAD -- daily/posts.json daily/comments.json daily/bundle.json 2>/dev/null || true
            cd - >/dev/null
          elif [ "$GUARD" != "0" ]; then
            echo "❌ social guard failed"; exit 1
          fi
          cd /tmp/pub
          git config user.name "SANAD Bot"; git config user.email "soldiom@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "📦 بيانات $(date -u +%F\ %H:%M)"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin main; then
              if grep -rlqE '^(<<<<<<<|=======|>>>>>>>)' daily/; then git rebase --abort 2>/dev/null || true
              else git push -q && exit 0; fi
            else git rebase --abort 2>/dev/null || true; fi
            sleep $((i*4))
          done
          exit 1
