name: 🎬 استئناف الفيديو
on:
  schedule:
    - cron: '25 */3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sanad-daily
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get install -y -q ffmpeg
      - run: pip install -q edge-tts gradio_client
      - name: استئناف مقاطع الفيديو الناقصة
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          VIDEO_ONLY: "1"
          SKIP_COUNCIL: "1"
        run: python pipeline/daily_anchor.py
      - name: حفظ
        if: always()
        run: |
          git config user.name "sanad-bot"
          git config user.email "bot@sanad.news"
          git add daily/
          git diff --cached --quiet && exit 0
          git commit -m "🎬 استئناف الفيديو $(date -u +%H:%M) [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i*6))
          done
          exit 1
      - name: نشر البيانات للمستودع العام
        if: always()
        env:
          DATA_PUSH_TOKEN: ${{ secrets.DATA_PUSH_TOKEN }}
        run: |
          [ -z "$DATA_PUSH_TOKEN" ] && exit 0
          rm -rf /tmp/pub && git clone -q --depth 1 \
            "https://x-access-token:${DATA_PUSH_TOKEN}@github.com/Soldiom/sanad-data.git" /tmp/pub
          mkdir -p /tmp/pub/daily
          cp -r daily/* /tmp/pub/daily/ 2>/dev/null || true
          cd /tmp/pub
          git config user.name "SANAD Bot"; git config user.email "soldiom@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "📦 بيانات $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do git pull -q --rebase --autostash origin main && git push -q && exit 0; sleep 5; done
