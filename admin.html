<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>سَنَد · لوحة التحكّم</title>
<style>
:root{
  --bg:#0A0E15; --panel:#111826; --raise:#161F2E; --line:#1E2734; --line-2:#161d28;
  --ink:#DEE4ED; --mut:#8B96A6; --dim:#5C6675;
  --gold:#E4C766; --gold-2:#C9A227;
  --ok:#3E9B72; --ok-l:#7FD2AC; --warn:#C9A227; --warn-l:#E4C766;
  --bad:#9E2B37; --bad-l:#E08792; --info:#4A7CC7;
  --ok-w:rgba(62,155,114,.13); --warn-w:rgba(201,162,39,.12); --bad-w:rgba(158,43,55,.15);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"SF Pro Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14.5px;line-height:1.5;min-height:100vh;
  background-image:radial-gradient(1000px 460px at 50% -10%,rgba(201,162,39,.06),transparent 70%)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.sadu{height:4px;background-image:repeating-linear-gradient(90deg,#0d5c3f 0 16px,#c9a227 16px 20px,#7a1f2b 20px 36px,#0a0a0a 36px 40px)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:22px 0 14px;border-bottom:1px solid var(--line)}
header h1{font-size:20px;font-weight:700}
header h1 .g{background:linear-gradient(135deg,#e8c96a,#c9a227 55%,#f5e3a8);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:12.5px}
.live{margin-inline-start:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,155,114,.5)}70%{box-shadow:0 0 0 7px rgba(62,155,114,0)}100%{box-shadow:0 0 0 0 rgba(62,155,114,0)}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:10px;
  padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.tabs button.on{background:rgba(201,162,39,.12);border-color:rgba(201,162,39,.4);color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:8px 0 16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px}
.kpi.accent .v{color:var(--gold)}
.kpi.bad{border-color:var(--bad);background:var(--bad-w)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:14px}
.panel .hd{padding:12px 14px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--gold);display:flex;justify-content:space-between;gap:8px;align-items:center}
.panel .bd{padding:14px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:13px}
.btn-p{background:var(--gold-2);color:#1A1206}
.btn-s{background:var(--raise);color:var(--ink);border:1px solid var(--line)}
.btn-d{background:var(--bad-w);color:var(--bad-l);border:1px solid rgba(158,43,55,.4)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
input,textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;width:100%}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 5px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);text-align:start;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.pill{display:inline-flex;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.p-ok{color:var(--ok-l);background:var(--ok-w)} .p-skip{color:var(--warn-l);background:var(--warn-w)}
.p-fail{color:var(--bad-l);background:var(--bad-w)} .p-idle{color:var(--dim);background:var(--line-2)}
.warn{background:var(--warn-w);border:1px solid rgba(201,162,39,.3);border-radius:11px;padding:12px 14px;font-size:12.5px;color:var(--mut);line-height:1.7;margin:10px 0}
.err{color:var(--bad-l)}
.ok{color:var(--ok-l)}
#gate{min-height:70vh;display:flex;align-items:center;justify-content:center}
.gate-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px}
.gate-card h2{font-size:18px;margin-bottom:6px}
.gate-card p{color:var(--mut);font-size:12.5px;line-height:1.7;margin-bottom:16px}
.view{display:none}.view.on{display:block}
.track{height:8px;background:var(--line-2);border-radius:6px;overflow:hidden;margin-top:5px}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-2),var(--gold))}
.tw{overflow-x:auto}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}
.chk input{width:auto}
.foot{font-size:12px;color:var(--mut);padding:10px 0;line-height:1.7}
a{color:var(--gold)}
</style>
</head>
<body>
<div class="sadu"></div>
<div class="wrap">
  <header>
    <h1>🛡️ <span class="g">سَنَد</span> · لوحة التحكّم</h1>
    <span class="sub">مراقبة · تكلفة · تحقّق · تشغيل</span>
    <span class="live"><span class="dot"></span><span id="live">—</span>
      <button class="btn btn-s" id="logoutBtn" style="display:none;padding:6px 10px;font-size:11px" onclick="logout()">خروج</button>
    </span>
  </header>

  <div id="gate">
    <div class="gate-card">
      <h2>دخول المشغّل</h2>
      <p>لوحة محمية بكلمة مرور. لا تُعرَض بيانات التشغيل للعامّة.</p>
      <label>كلمة المرور</label>
      <input type="password" id="pw" autocomplete="current-password">
      <div class="row" style="margin-top:14px">
        <button class="btn btn-p" style="width:100%" onclick="login()">دخول</button>
      </div>
      <div id="gateMsg" class="foot err" style="display:none"></div>
    </div>
  </div>

  <div id="app" style="display:none">
    <div id="banner" class="warn" style="display:none"></div>
    <div class="tabs" id="tabs">
      <button type="button" data-tab="overview" class="on">نظرة</button>
      <button type="button" data-tab="agents">وكلاء</button>
      <button type="button" data-tab="cost">تكلفة</button>
      <button type="button" data-tab="verify">تحقّق</button>
      <button type="button" data-tab="feed">التغذية</button>
      <button type="button" data-tab="social">سوشيال</button>
      <button type="button" data-tab="controls">التحكّم</button>
    </div>
    <div class="view on" id="tab-overview"></div>
    <div class="view" id="tab-agents"></div>
    <div class="view" id="tab-cost"></div>
    <div class="view" id="tab-verify"></div>
    <div class="view" id="tab-feed"></div>
    <div class="view" id="tab-social"></div>
    <div class="view" id="tab-controls"></div>
  </div>
</div>
<script>
const TOKEN_KEY="sanad_admin_token";
let TOKEN=sessionStorage.getItem(TOKEN_KEY)||"";
let STATUS=null;

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd=n=>"$"+Number(n||0).toFixed(2);
function agoTxt(iso){
  if(!iso) return "—";
  const h=(Date.now()-new Date(iso))/36e5; if(isNaN(h)) return "—";
  if(h<1) return Math.max(0,Math.round(h*60))+" د";
  if(h<48) return h.toFixed(1)+" س";
  return Math.round(h/24)+" ي";
}

async function api(body, method="POST"){
  const opts={method, headers:{"Content-Type":"application/json"}};
  if(TOKEN) opts.headers.Authorization="Bearer "+TOKEN;
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch("/api/admin", opts);
  const j=await r.json().catch(()=>({}));
  if(r.status===401){ logout(true); throw new Error(j.error||"غير مصرّح"); }
  if(!r.ok) throw new Error(j.error||j.message||("HTTP "+r.status));
  return j;
}

async function login(){
  const password=document.getElementById("pw").value;
  const msg=document.getElementById("gateMsg");
  msg.style.display="none";
  try{
    const j=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:"login",password})}).then(r=>r.json().then(x=>({ok:r.ok,x})));
    if(!j.ok) throw new Error(j.x.error||"فشل الدخول");
    TOKEN=j.x.token; sessionStorage.setItem(TOKEN_KEY,TOKEN);
    showApp(); await refresh();
  }catch(e){ msg.style.display="block"; msg.textContent=e.message||String(e) }
}
function logout(silent){
  TOKEN=""; sessionStorage.removeItem(TOKEN_KEY);
  document.getElementById("app").style.display="none";
  document.getElementById("gate").style.display="flex";
  document.getElementById("logoutBtn").style.display="none";
  if(!silent) document.getElementById("gateMsg").style.display="none";
}
function showApp(){
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("logoutBtn").style.display="inline-flex";
}

document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button[data-tab]"); if(!b) return;
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="tab-"+b.dataset.tab));
});
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")login()});

async function refresh(){
  STATUS=await api({action:"status"});
  const t=new Date();
  document.getElementById("live").textContent="حدّث "+t.toLocaleTimeString("ar-KW",{hour:"2-digit",minute:"2-digit"});
  const ban=document.getElementById("banner");
  if(STATUS.warning||(STATUS.control_meta&&STATUS.control_meta.warning)){
    ban.style.display="block";
    ban.textContent=STATUS.warning||STATUS.control_meta.warning;
  } else ban.style.display="none";
  renderAll();
}

function renderAll(){
  renderOverview(); renderAgents(); renderCost(); renderVerify(); renderFeed(); renderSocial(); renderControls();
  loadHealth();   // 🩺 حالةُ الأقسامِ من نتيجتِها — بعد رسمِ تبويبِ الخلاصة
}

function renderOverview(){
  const s=STATUS||{}, a=s.agents||{}, c=s.cost||{}, v=s.verify||{}, ctrl=s.control||{};
  const healthy=a.healthy||0, total=a.total||0, fails=((a.agents)||[]).filter(x=>x.status==="fail").length;
  document.getElementById("tab-overview").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="l">وكلاء سليمون</div><div class="v">${healthy}<small style="font-size:14px;color:var(--mut)">/${total}</small>${fails?` <small style="color:var(--bad-l)">· ${fails} فشل</small>`:""}</div></div>
      <div class="kpi accent"><div class="l">تكلفة الخط</div><div class="v">${c.usd!=null?usd(c.usd):"—"}</div></div>
      <div class="kpi"><div class="l">تحقّق اليوم</div><div class="v">${v.calls!=null?v.calls:"0"} <small style="font-size:13px;color:var(--mut)">${usd(v.usd||0)}</small></div></div>
      <div class="kpi ${ctrl.paid_kill_switch?"bad":""}"><div class="l">وقف الدفع</div><div class="v">${ctrl.paid_kill_switch?"مفعّل":"إيقاف"}</div></div>
      <div class="kpi"><div class="l">آخر بناء</div><div class="v" style="font-size:16px">${agoTxt(s.built||a.updated)}</div></div>
    </div>
    <div class="row">
      <button class="btn btn-p" onclick="refresh()">↻ تحديث الآن</button>
      <button class="btn btn-s" onclick="triggerWf('news-refresh')">تشغيل news-refresh</button>
      <button class="btn btn-s" onclick="triggerWf('daily-anchor')">تشغيل daily-anchor</button>
    </div>
    <div class="foot">المصدر: ${esc(s.control_meta&&s.control_meta.source||"—")} · المثابرة: ${(s.control_meta&&s.control_meta.sticky)?"نعم":"ذاكرة فقط"}</div>`;
}

function renderAgents(){
  const A=((STATUS&&STATUS.agents&&STATUS.agents.agents)||[]);
  const paused=new Set((STATUS.control&&STATUS.control.paused_agents)||[]);
  const lbl={ok:["p-ok","نشط"],skip:["p-skip","مجدول"],fail:["p-fail","فشل"],idle:["p-idle","صامت"]};
  document.getElementById("tab-agents").innerHTML=`
    <div class="panel"><div class="hd">طبقة الوكلاء <span class="mono" style="color:var(--mut);font-weight:500">${A.length}</span></div>
    <div class="tw"><table><thead><tr><th>الاسم</th><th>الحالة</th><th>عمر</th><th>تحكّم</th></tr></thead><tbody>
    ${A.map(a=>{
      const L=lbl[a.status]||["p-idle",a.status];
      const isP=paused.has(a.id);
      return `<tr>
        <td><b>${esc(a.icon||"")} ${esc(a.name)}</b><div style="color:var(--dim);font-size:11.5px">${esc(a.role||"")}</div>
          <div style="color:var(--mut);font-size:11px" class="mono">${esc(a.id)}</div></td>
        <td><span class="pill ${isP?"p-idle":L[0]}">${isP?"متوقف":L[1]}</span>
          <div style="font-size:11px;color:var(--mut);margin-top:4px">${esc((a.note||"").slice(0,48))}</div></td>
        <td class="mono">${agoTxt(a.at)}</td>
        <td>${isP
          ?`<button class="btn btn-s" onclick="resumeAgent('${esc(a.id)}')">تشغيل</button>`
          :`<button class="btn btn-d" onclick="pauseAgent('${esc(a.id)}')">إيقاف</button>`}</td>
      </tr>`;
    }).join("")||"<tr><td colspan=4>لا بيانات</td></tr>"}
    </tbody></table></div></div>`;
}

function renderCost(){
  const c=STATUS.cost||{}, v=STATUS.verify||{}, ctrl=STATUS.control||{};
  const by=Object.entries(c.by||{}).sort((a,b)=>b[1]-a[1]);
  const mx=by.length?by[0][1]:1;
  document.getElementById("tab-cost").innerHTML=`
    <div class="kpis">
      <div class="kpi accent"><div class="l">خط الأنابيب / السقف</div><div class="v">${usd(c.usd||0)}<small style="font-size:13px;color:var(--mut)"> / ${usd(ctrl.pipeline_daily_budget_usd||c.budget||0.8)}</small></div></div>
      <div class="kpi"><div class="l">تحقّق المستخدمين</div><div class="v">${usd(v.usd||0)}<small style="font-size:13px;color:var(--mut)"> / ${usd(ctrl.verify_daily_budget_usd||0.5)}</small></div></div>
      <div class="kpi"><div class="l">تقدير الشهر</div><div class="v">${usd(c.month_est||0)}</div></div>
    </div>
    <div class="panel"><div class="hd">حسب الوكيل</div><div class="bd">
      ${by.map(([k,val])=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between"><b>${esc(k)}</b><span class="mono">${usd(val)}</span></div>
        <div class="track"><i style="width:${Math.max(3,val/mx*100)}%"></i></div></div>`).join("")||"<div class='foot'>لا تكلفة مسجّلة اليوم</div>"}
    </div></div>
    <div class="panel"><div class="hd">ضبط السقوف</div><div class="bd">
      <label>سقف خط الأنابيب (USD/يوم)</label>
      <input type="number" step="0.05" id="budPipe" value="${esc(ctrl.pipeline_daily_budget_usd??0.8)}">
      <label>سقف التحقّق (USD/يوم)</label>
      <input type="number" step="0.05" id="budVerify" value="${esc(ctrl.verify_daily_budget_usd??0.5)}">
      <label>حدّ التحقّق لكل IP / ساعة</label>
      <input type="number" step="1" id="ipLimit" value="${esc(ctrl.verify_per_ip_hour??5)}">
      <div class="chk"><input type="checkbox" id="killPay" ${ctrl.paid_kill_switch?"checked":""}><label for="killPay" style="margin:0">وقف الدفع الطارئ (يمنع النماذج المدفوعة)</label></div>
      <div class="row"><button class="btn btn-p" onclick="saveBudgets()">حفظ السقوف</button></div>
    </div></div>`;
}

function renderVerify(){
  const v=STATUS.verify||{}, act=v.activity||[], ctrl=STATUS.control||{};
  document.getElementById("tab-verify").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="l">نداءات اليوم</div><div class="v">${v.calls||0}</div></div>
      <div class="kpi accent"><div class="l">إنفاق التحقّق</div><div class="v">${usd(v.usd||0)}</div></div>
      <div class="kpi ${ctrl.verify_enabled===false?"bad":""}"><div class="l">التبويب</div><div class="v" style="font-size:16px">${ctrl.verify_enabled===false?"معطّل":"مفعّل"}</div></div>
    </div>
    <div class="row">
      <button class="btn btn-s" onclick="clearVerifyCache()">مسح الكاش</button>
      <button class="btn btn-d" onclick="toggleVerify(false)">تعطيل تحقّق</button>
      <button class="btn btn-p" onclick="toggleVerify(true)">تفعيل تحقّق</button>
    </div>
    <div class="panel"><div class="hd">آخر العمليات</div>
    <div class="tw"><table><thead><tr><th>وقت</th><th>مضيف</th><th>طبقة</th><th>حكم</th><th>$</th></tr></thead><tbody>
    ${act.slice().reverse().map(x=>`<tr>
      <td class="mono">${agoTxt(x.at)}</td>
      <td class="mono">${esc(x.host||"—")}</td>
      <td>${esc(x.tier||x.cost_tier||"—")}</td>
      <td>${esc(x.verdict||"—")}</td>
      <td class="mono">${x.usd!=null?Number(x.usd).toFixed(4):"—"}</td>
    </tr>`).join("")||"<tr><td colspan=5 class='foot'>لا نشاط بعد على هذه النسخة</td></tr>"}
    </tbody></table></div></div>`;
}

/* لوحةُ الحِراسة: الحالةُ من نتيجةِ كلِّ قسمٍ (عُمر + عدد) لا من نجاحِ التشغيل.
   وُلدت بعد أن بقيَ قسمُ التحذيراتِ فارغًا ٦ أيّامٍ وكلُّ المؤشّراتِ خضراء. */
let HEALTH=null;
const HEALTH_RAW="https://raw.githubusercontent.com/Soldiom/sanad-data/main/daily/health.json";
async function loadHealth(){
  try{ const r=await fetch(HEALTH_RAW+"?t="+Date.now()); HEALTH=r.ok?await r.json():null; }
  catch(e){ HEALTH=null }
  const box=document.getElementById("healthBox"); if(!box) return;
  if(!HEALTH){ box.innerHTML=`<div class="panel"><div class="hd">🩺 الحِراسة</div>
    <div class="mono" style="padding:8px">لم يُنشَرْ health.json بعد — يُكتَبُ مع أوّلِ دورةِ أنبوبٍ بعد الدمج.</div></div>`; return; }
  const S=HEALTH.sections||[];
  // «خامد» مقصودٌ لا عطل — لا يُحتسَبُ في مَن «يحتاجُ نظرًا» كي لا يبلُدَ الإنذار
  const bad=S.filter(s=>s.state!=="fresh"&&s.state!=="dormant");
  const dorm=S.filter(s=>s.state==="dormant").length;
  const LBL={fresh:"حيّ",stale:"بائت",empty:"فارغ",dead:"ميّت",dormant:"خامد"};
  const CL={fresh:"ok",stale:"",empty:"",dead:"err",dormant:""};
  box.innerHTML=`<div class="panel"><div class="hd">🩺 الحِراسة · ${bad.length?`<span class="err">${bad.length} قسمًا يحتاجُ نظرًا</span>`:'<span class="ok">كلُّ الأقسامِ العاملةِ حيّة</span>'}${dorm?` <span style="color:var(--mut);font-weight:500">· ${dorm} خامد</span>`:""}</div>
    <div class="tw"><table><thead><tr><th>قسم</th><th>الحالة</th><th>العُمر</th><th>عناصر</th><th>ملاحظة</th></tr></thead><tbody>
    ${S.map(s=>`<tr><td>${s.key}</td>
      <td class="${CL[s.state]||""}">${LBL[s.state]||s.state}</td>
      <td class="mono">${s.age_h==null?"—":s.age_h+"س"}</td>
      <td class="mono">${s.items==null?"—":s.items}</td>
      <td class="mono" style="font-size:11px">${(s.note||"").slice(0,60)}</td></tr>`).join("")}
    </tbody></table></div></div>`;
}

function renderFeed(){
  const sec=STATUS.sections||{};
  const CADENCE={news:.6,verify:.6,council:.6,evolution:.6,agents:.6,forecast:6.5,analyst:6.5,alerts:8.5,official:13,rumors:8.5,column:27,latest:26,dua:26};
  const NM={news:"الأخبار",verify:"التدقيق",council:"المجلس",evolution:"التطوّر",agents:"الوكلاء",forecast:"الاستقراء",analyst:"المحلّل",alerts:"التحذيرات",official:"من المَنبع",rumors:"تحت المجهر",column:"عمودُ الجريدة",latest:"نشرةُ المذيع",dua:"الدعاء"};
  const keys=Object.keys(CADENCE);
  document.getElementById("tab-feed").innerHTML=`
    <div id="healthBox"></div>
    <div class="row">
      <button class="btn btn-p" onclick="triggerWf('news-refresh')">↻ news-refresh</button>
      <button class="btn btn-s" onclick="triggerWf('daily-anchor')">🎙️ daily-anchor</button>
    </div>
    <div class="panel"><div class="hd">نبض الطزاجة</div>
    <div class="tw"><table><thead><tr><th>قسم</th><th>آخر تحديث</th><th>مهلة</th></tr></thead><tbody>
    ${keys.map(k=>{
      const iso=sec[k]; const h=iso?(Date.now()-new Date(iso))/36e5:null; const cad=CADENCE[k];
      let st="—", col="";
      if(h!=null){ if(h<=cad*1.5){st="طازج";col="ok"} else if(h<=cad*3){st="متأخّر";col=""} else {st="متجمّد";col="err"} }
      return `<tr><td>${NM[k]||k}</td><td class="mono">${iso?agoTxt(iso)+" · "+st:"—"}</td>
        <td class="mono">~${cad<1?Math.round(cad*60)+"د":cad+"س"}</td></tr>`;
    }).join("")}
    </tbody></table></div></div>
    <div class="panel"><div class="hd">الشائعات</div><div class="bd foot">
      ${STATUS.rumors?`عناصر: ${esc((STATUS.rumors.items||[]).length)} · ${esc((STATUS.rumors.audit&&STATUS.rumors.audit.note)||"")}`:"لا بيانات شائعات"}
    </div></div>`;
}

const SOCIAL_RAW="https://raw.githubusercontent.com/Soldiom/sanad-data/main/daily/social/";
const SOCIAL_LOCAL="/daily/social/";
async function renderSocial(){
  const el=document.getElementById("tab-social"); if(!el) return;
  el.innerHTML=`<div class="panel"><div class="hd">باكدج السوشيال</div><div class="bd foot">يُحمَّل…</div></div>
    <div class="row"><button class="btn btn-p" onclick="triggerWf('social-pack')">🖼️ توليد وإرسال لتلغرام</button></div>`;
  let idx=null;
  for (const base of [SOCIAL_RAW, SOCIAL_LOCAL]){
    try{
      const r=await fetch(base+"index.json?t="+Date.now());
      if(r.ok){ idx=await r.json(); break; }
    }catch(e){}
  }
  const packs=(idx&&idx.packs)||[];
  if(!packs.length){
    el.innerHTML=`<div class="panel"><div class="hd">باكدج السوشيال</div><div class="bd foot">لا باكدج بعد — شغّل workflow البطاقة.</div></div>
      <div class="row"><button class="btn btn-p" onclick="triggerWf('social-pack')">🖼️ توليد وإرسال لتلغرام</button></div>`;
    return;
  }
  const top=packs[0];
  const date=top.date;
  let baseUsed=SOCIAL_LOCAL;
  try{ const r=await fetch(SOCIAL_RAW+date+"/feed.png",{method:"HEAD"}); if(r.ok) baseUsed=SOCIAL_RAW; }catch(e){}
  const feed=baseUsed+date+"/feed.png?t="+Date.now();
  const story=baseUsed+date+"/story.png?t="+Date.now();
  el.innerHTML=`
    <div class="row">
      <button class="btn btn-p" onclick="triggerWf('social-pack')">🖼️ توليد وإرسال لتلغرام</button>
      <button class="btn btn-s" onclick="refresh()">↻ تحديث</button>
    </div>
    <div class="panel"><div class="hd">اليوم · ${esc(date)} · ${esc(top.grade||"")}</div>
      <div class="bd">
        <div style="font-weight:700;margin-bottom:10px;line-height:1.7">${esc(top.head||"")}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div><div class="foot">فيد 1080²</div><img src="${esc(feed)}" alt="feed" style="width:100%;border-radius:12px;border:1px solid var(--border);background:var(--card2)"></div>
          <div><div class="foot">ستوري</div><img src="${esc(story)}" alt="story" style="width:100%;border-radius:12px;border:1px solid var(--border);background:var(--card2)"></div>
        </div>
        <div class="row" style="margin-top:12px">
          <a class="btn btn-s" href="${esc(feed)}" download>تنزيل الفيد</a>
          <a class="btn btn-s" href="${esc(story)}" download>تنزيل الستوري</a>
          <a class="btn btn-s" href="${esc(top.post_url||"#")}" target="_blank" rel="noopener">رابط المنشور</a>
        </div>
      </div>
    </div>
    <div class="panel"><div class="hd">الأرشيف · ${packs.length}</div>
    <div class="tw"><table><thead><tr><th>تاريخ</th><th>العنوان</th><th>درجة</th></tr></thead><tbody>
    ${packs.slice(0,14).map(p=>`<tr><td class="mono">${esc(p.date)}</td><td>${esc((p.head||"").slice(0,70))}</td><td>${esc(p.grade||"")}</td></tr>`).join("")}
    </tbody></table></div></div>`;
}

function renderControls(){
  const c=STATUS.control||{};
  const desks=["noura","samir","laith","huda","hakim"];
  const en=new Set(c.desks_enabled||desks);
  document.getElementById("tab-controls").innerHTML=`
    <div class="panel"><div class="hd">أعلام الميزات</div><div class="bd">
      <div class="chk"><input type="checkbox" id="fVerify" ${c.verify_enabled!==false&&c.verify_tab!==false?"checked":""}><label for="fVerify" style="margin:0">إظهار تبويب تحقّق</label></div>
      <div class="chk"><input type="checkbox" id="fKill" ${c.paid_kill_switch?"checked":""}><label for="fKill" style="margin:0">وقف الدفع</label></div>
      <label>مكاتب الرصد الظاهرة</label>
      <div class="row">${desks.map(d=>`<label class="chk" style="margin:0"><input type="checkbox" class="deskEn" value="${d}" ${en.has(d)?"checked":""}> ${d}</label>`).join("")}</div>
      <label>رسالة صيانة (فارغ = لا شيء)</label>
      <textarea id="maint" rows="3">${esc(c.maintenance||"")}</textarea>
      <div class="row"><button class="btn btn-p" onclick="saveFlags()">حفظ التحكّم</button></div>
    </div></div>
    <div class="foot">الملف: daily/control.json على sanad-data عند توفّر الرمز · وإلا ذاكرة النسخة فقط.</div>`;
}

async function pauseAgent(id){ await api({action:"pause_agent",id}); await refresh(); }
async function resumeAgent(id){ await api({action:"resume_agent",id}); await refresh(); }
async function clearVerifyCache(){ await api({action:"clear_verify_cache"}); alert("تم مسح كاش التحقّق على هذه النسخة"); await refresh(); }
async function triggerWf(workflow){
  try{ const j=await api({action:"trigger",workflow}); alert("أُطلق: "+workflow+(j.message?" · "+j.message:"")); }
  catch(e){ alert(e.message||String(e)); }
}
async function saveBudgets(){
  const config={
    ...(STATUS.control||{}),
    pipeline_daily_budget_usd: parseFloat(document.getElementById("budPipe").value),
    verify_daily_budget_usd: parseFloat(document.getElementById("budVerify").value),
    verify_per_ip_hour: parseInt(document.getElementById("ipLimit").value,10),
    paid_kill_switch: document.getElementById("killPay").checked
  };
  await api({action:"save_config",config}); await refresh();
}
async function toggleVerify(on){
  const config={...(STATUS.control||{}), verify_enabled:on, verify_tab:on};
  await api({action:"save_config",config}); await refresh();
}
async function saveFlags(){
  const desks=[...document.querySelectorAll(".deskEn:checked")].map(x=>x.value);
  const on=document.getElementById("fVerify").checked;
  const config={
    ...(STATUS.control||{}),
    verify_enabled:on, verify_tab:on,
    paid_kill_switch: document.getElementById("fKill").checked,
    desks_enabled: desks,
    maintenance: document.getElementById("maint").value.trim()
  };
  await api({action:"save_config",config}); await refresh();
}

(async function boot(){
  if(!TOKEN) return;
  try{ showApp(); await refresh(); setInterval(()=>{if(TOKEN) refresh().catch(()=>{})},30000); }
  catch(e){ logout(true); }
})();
</script>
</body>
</html>
