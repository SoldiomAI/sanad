<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سَنَد — نشرة الأخبار المُسنَدة</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--gold:#d4a94e;--txt:#e6edf3;--dim:#8b949e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",Tahoma,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
h1{font-size:2.2rem;color:var(--gold);letter-spacing:1px}
.sub{color:var(--dim);margin:6px 0 22px;font-size:.95rem}
.card{background:var(--card);border:1px solid #21262d;border-radius:16px;padding:20px;max-width:760px;width:100%;margin-bottom:16px}
video,audio{width:100%;border-radius:10px;background:#000}
.date{color:var(--gold);font-size:.9rem;margin-bottom:10px}
.script{line-height:2;font-size:1.05rem;white-space:pre-wrap}
.badge{display:inline-block;background:#1f6feb22;border:1px solid #1f6feb55;color:#79c0ff;border-radius:20px;padding:2px 12px;font-size:.8rem;margin:3px 2px}
.badge.sahih{background:#23863622;border-color:#23863655;color:#7ee787}
.src{color:var(--dim);font-size:.85rem}
footer{margin-top:auto;color:var(--dim);font-size:.8rem;padding-top:20px}
.hide{display:none}
</style></head>
<body>
<h1>سَنَد</h1>
<div class="sub">نشرة أخبار موثّقة — مبنية على خمسة معايير من علم الحديث</div>

<div class="card"><div class="date" id="d"></div>
  <video id="v" class="hide" controls playsinline></video>
  <audio id="a" class="hide" controls></audio>
</div>

<div class="card"><div class="script" id="s">جارِ تحميل النشرة…</div></div>
<div class="card" id="items"></div>

<footer>سَنَد © تتجدد آليًا كل يوم ٦ مساءً بتوقيت الكويت</footer>
<script>
const RAW="https://raw.githubusercontent.com/Soldiom/sanad/main/daily/";
fetch(RAW+"latest.json?t="+Date.now()).then(r=>r.json()).then(m=>{
  d.textContent="نشرة يوم "+m.date;
  s.textContent=m.script;
  if(m.video_date===m.date){v.src=RAW+m.video+"?t="+Date.now();v.classList.remove("hide")}
  else{a.src=RAW+m.audio+"?t="+Date.now();a.classList.remove("hide")}
  items.innerHTML=(m.items||[]).map(i=>
    `<div style="margin-bottom:10px"><span class="badge ${i.grade==='صحيح'?'sahih':''}">${i.grade==='صحيح'?'صحيح ✓':'حسن'}</span> ${i.head} <span class="src">${i.src?'— '+i.src:''}</span></div>`).join("");
}).catch(_=>{s.textContent="النشرة الأولى قيد التجهيز — عُد قريبًا 🌙"});
</script>
</body></html>
